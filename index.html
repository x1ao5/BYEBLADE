<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帝王爆擊詳細測試紀錄器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="max-w-2xl w-full space-y-4">
    <!-- 標題與基本配置輸入區 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h1 class="text-xl font-bold text-amber-400 text-center">帝王爆擊詳細測試紀錄器</h1>
      
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div>
          <label class="text-xs text-slate-400">固鎖輪盤</label>
          <input id="lock-ring" type="text" placeholder="例：帝王/某輪盤" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" onchange="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">零件 1 名稱</label>
          <input id="part-1" type="text" placeholder="零件 1" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" onchange="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">零件 2 名稱</label>
          <input id="part-2" type="text" placeholder="零件 2" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" onchange="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">零件 3 名稱</label>
          <input id="part-3" type="text" placeholder="零件 3" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" onchange="saveConfig()">
        </div>
      </div>

      <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-700">
        <span>完成進度：<strong id="progress-text" class="text-amber-400">0 / 27 (0%)</strong></span>
        <button onclick="exportCSV()" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded text-xs transition">匯出 CSV 表格</button>
      </div>
    </div>

    <!-- 列表區 -->
    <div id="list-container" class="space-y-2"></div>

    <button onclick="resetAll()" class="w-full py-2 bg-red-900/50 hover:bg-red-800 text-red-200 font-bold rounded-xl border border-red-700 transition text-sm">
      清除所有紀錄
    </button>
  </div>

  <script>
    const listContainer = document.getElementById('list-container');
    const progressText = document.getElementById('progress-text');
    
    let config = JSON.parse(localStorage.getItem('bey_config')) || { ring: '', p1: '', p2: '', p3: '' };
    let records = JSON.parse(localStorage.getItem('bey_records_detail')) || {};

    // 建立 27 種組合
    const combos = [];
    for(let a=1; a<=3; a++) {
      for(let b=1; b<=3; b++) {
        for(let c=1; c<=3; c++) {
          combos.push(`${a}${b}${c}`);
        }
      }
    }

    // 初始化設定框
    document.getElementById('lock-ring').value = config.ring;
    document.getElementById('part-1').value = config.p1;
    document.getElementById('part-2').value = config.p2;
    document.getElementById('part-3').value = config.p3;

    function saveConfig() {
      config = {
        ring: document.getElementById('lock-ring').value,
        p1: document.getElementById('part-1').value,
        p2: document.getElementById('part-2').value,
        p3: document.getElementById('part-3').value
      };
      localStorage.setItem('bey_config', JSON.stringify(config));
    }

    function render() {
      listContainer.innerHTML = '';
      let checkedCount = 0;

      combos.forEach((combo, index) => {
        const data = records[combo] || { checked: false, time: '', note: '' };
        if(data.checked) checkedCount++;

        const p1Name = config.p1 ? `${config.p1}(${combo[0]})` : `零件${combo[0]}`;
        const p2Name = config.p2 ? `${config.p2}(${combo[1]})` : `零件${combo[1]}`;
        const p3Name = config.p3 ? `${config.p3}(${combo[2]})` : `零件${combo[2]}`;

        const item = document.createElement('div');
        item.className = `p-3 rounded-xl border transition flex flex-col md:flex-row md:items-center justify-between gap-2 ${
          data.checked ? 'bg-slate-800 border-amber-500/50' : 'bg-slate-800/40 border-slate-700/60'
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${data.checked ? 'checked' : ''} onchange="toggleCheck('${combo}', this.checked)" class="w-5 h-5 accent-amber-400 cursor-pointer">
            <div>
              <div class="font-mono font-bold text-amber-400">#${index + 1} - 組合 [ ${combo} ]</div>
              <div class="text-xs text-slate-400">${p1Name} + ${p2Name} + ${p3Name}</div>
            </div>
          </div>
          <div class="flex gap-2 text-xs">
            <input type="number" step="0.01" placeholder="秒數(s)" value="${data.time}" onchange="updateData('${combo}', 'time', this.value)" class="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400">
            <input type="text" placeholder="備註/勝負" value="${data.note}" onchange="updateData('${combo}', 'note', this.value)" class="w-32 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400">
          </div>
        `;
        listContainer.appendChild(item);
      });

      const pct = Math.round((checkedCount / 27) * 100);
      progressText.innerText = `${checkedCount} / 27 (${pct}%)`;
    }

    function toggleCheck(combo, checked) {
      if(!records[combo]) records[combo] = { time: '', note: '' };
      records[combo].checked = checked;
      saveData();
    }

    function updateData(combo, field, value) {
      if(!records[combo]) records[combo] = { checked: false, time: '', note: '' };
      records[combo][field] = value;
      saveData();
    }

    function saveData() {
      localStorage.setItem('bey_records_detail', JSON.stringify(records));
      render();
    }

    function resetAll() {
      if(confirm('確定要清除所有測試紀錄嗎？')) {
        records = {};
        localStorage.removeItem('bey_records_detail');
        render();
      }
    }

    function exportCSV() {
      let csv = "\uFEFF組合編號,固鎖輪盤,零件1,零件2,零件3,已測試,秒數(s),備註\n";
      combos.forEach((combo) => {
        const d = records[combo] || { checked: false, time: '', note: '' };
        const p1 = config.p1 || `零件${combo[0]}`;
        const p2 = config.p2 || `零件${combo[1]}`;
        const p3 = config.p3 || `零件${combo[2]}`;
        csv += `"${combo}","${config.ring}","${p1}","${p2}","${p3}","${d.checked ? '是' : '否'}","${d.time}","${d.note}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `帝王爆擊測試紀錄之鍏子去烘乾_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    render();
  </script>
</body>
</html>

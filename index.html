<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帝王爆擊詳細測試紀錄器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="max-w-2xl w-full space-y-4">
    <!-- 標題與基本配置輸入區 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h1 class="text-xl font-bold text-amber-400 text-center">帝王爆擊詳細測試紀錄器之樓欸烘乾</h1>
      
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div>
          <label class="text-xs text-slate-400">鎖定紋章</label>
          <input id="input-crest" type="text" placeholder="例：帝王" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" oninput="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">主要戰刃</label>
          <input id="input-main" type="text" placeholder="例：爆擊" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" oninput="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">輔助戰刃</label>
          <input id="input-sub" type="text" placeholder="例：W" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" oninput="saveConfig()">
        </div>
        <div>
          <label class="text-xs text-slate-400">固鎖輪盤</label>
          <input id="input-ring" type="text" placeholder="例：970" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400" oninput="saveConfig()">
        </div>
      </div>

      <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-700">
        <span>完成進度：<strong id="progress-text" class="text-amber-400">0 / 27 (0%)</strong></span>
        <button onclick="exportCSV()" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded text-xs transition">匯出 CSV 表格</button>
      </div>
    </div>

    <!-- 列表區 -->
    <div id="list-container" class="space-y-2"></div>

    <button onclick="resetAll()" class="w-full py-2 bg-red-900/50 hover:bg-red-800 text-red-200 font-bold rounded-xl border border-red-700 transition text-sm">
      清除所有紀錄
    </button>
  </div>

  <script>
    const listContainer = document.getElementById('list-container');
    const progressText = document.getElementById('progress-text');
    
    let config = JSON.parse(localStorage.getItem('bey_config_v2')) || { crest: '', main: '', sub: '', ring: '' };
    let records = JSON.parse(localStorage.getItem('bey_records_detail')) || {};

    // 建立 27 種組合
    const combos = [];
    for(let a=1; a<=3; a++) {
      for(let b=1; b<=3; b++) {
        for(let c=1; c<=3; c++) {
          combos.push(`${a}${b}${c}`);
        }
      }
    }

    // 初始化設定框
    document.getElementById('input-crest').value = config.crest;
    document.getElementById('input-main').value = config.main;
    document.getElementById('input-sub').value = config.sub;
    document.getElementById('input-ring').value = config.ring;

    // 儲存配置並即時更新
    function saveConfig() {
      config = {
        crest: document.getElementById('input-crest').value,
        main: document.getElementById('input-main').value,
        sub: document.getElementById('input-sub').value,
        ring: document.getElementById('input-ring').value
      };
      localStorage.setItem('bey_config_v2', JSON.stringify(config));
      render();
    }

    function render() {
      listContainer.innerHTML = '';
      let checkedCount = 0;

      const nameCrest = config.crest || '鎖定紋章';
      const nameMain = config.main || '主要戰刃';
      const nameSub = config.sub || '輔助戰刃';
      const nameRing = config.ring || '固鎖輪盤';

      combos.forEach((combo, index) => {
        const data = records[combo] || { checked: false, time: '', note: '' };
        if(data.checked) checkedCount++;

        // 修正標號位置：前三項加(1/2/3)，固鎖輪盤不加標號
        const comboSubtitle = `${nameCrest}(${combo[0]}) + ${nameMain}(${combo[1]}) + ${nameSub}(${combo[2]}) + ${nameRing}`;

        const item = document.createElement('div');
        item.className = `p-3 rounded-xl border transition flex flex-col md:flex-row md:items-center justify-between gap-2 ${
          data.checked ? 'bg-slate-800 border-amber-500/50' : 'bg-slate-800/40 border-slate-700/60'
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${data.checked ? 'checked' : ''} onchange="toggleCheck('${combo}', this.checked)" class="w-5 h-5 accent-amber-400 cursor-pointer">
            <div>
              <div class="font-mono font-bold text-amber-400">#${index + 1} - 組合 [ ${combo} ]</div>
              <div class="text-xs text-slate-400">${comboSubtitle}</div>
            </div>
          </div>
          <div class="flex gap-2 text-xs">
            <input type="number" step="0.01" placeholder="秒數(s)" value="${data.time}" onchange="updateData('${combo}', 'time', this.value)" class="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400">
            <input type="text" placeholder="備註/勝負" value="${data.note}" onchange="updateData('${combo}', 'note', this.value)" class="w-32 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-400">
          </div>
        `;
        listContainer.appendChild(item);
      });

      const pct = Math.round((checkedCount / 27) * 100);
      progressText.innerText = `${checkedCount} / 27 (${pct}%)`;
    }

    function toggleCheck(combo, checked) {
      if(!records[combo]) records[combo] = { time: '', note: '' };
      records[combo].checked = checked;
      saveData();
    }

    function updateData(combo, field, value) {
      if(!records[combo]) records[combo] = { checked: false, time: '', note: '' };
      records[combo][field] = value;
      saveData();
    }

    function saveData() {
      localStorage.setItem('bey_records_detail', JSON.stringify(records));
      render();
    }

    function resetAll() {
      if(confirm('確定要清除所有測試紀錄嗎？')) {
        records = {};
        localStorage.removeItem('bey_records_detail');
        render();
      }
    }

    function exportCSV() {
      let csv = "\uFEFF組合編號,鎖定紋章,主要戰刃,輔助戰刃,固鎖輪盤,已測試,秒數(s),備註\n";
      combos.forEach((combo) => {
        const d = records[combo] || { checked: false, time: '', note: '' };
        const c = config.crest || '鎖定紋章';
        const m = config.main || '主要戰刃';
        const s = config.sub || '輔助戰刃';
        const r = config.ring || '固鎖輪盤';
        csv += `"${combo}","${c}(${combo[0]})","${m}(${combo[1]})","${s}(${combo[2]})","${r}","${d.checked ? '是' : '否'}","${d.time}","${d.note}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `帝王爆擊測試紀錄_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    render();
  </script>
</body>
</html>
